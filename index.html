<body>
<div class="wrap">
<header><h1>Mi Tablero de Estudio</h1><div class="dt" id="dt" aria-label="Fecha de hoy"></div><div class="hb"><button data-a="stats" aria-label="Estadísticas">📊</button><button class="g" data-a="ajustes" aria-label="Ajustes">⚙</button></div></header>
<p class="sub" id="frase"></p>
<div id="top"></div>
<div id="edbar"></div>
<main class="grid" id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script>
const SECS={pomo:['⏱','Sesiones de estudio'],tareas:['✅','Mis tareas'],cal:['📅','Calendario']};
const PH='Pequeños pasos, todos los días. No hace falta ser perfecta, solo empezar.';
const def=()=>({u:0,theme:'light',goal:120,order:Object.keys(SECS),hidden:{},col:{},hd:{},tareas:[],ev:[],evh:{},rec:[],mig:0,rm:{},sz:{},custom:{},menuOrder:['theme','colores','menu','nube','frase'],log:{},phrase:PH,sess:null,sub:'',dur:15});
const $=s=>document.querySelector(s);
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

if(!e){e=document.createElement('style');e.id='palst';document.head.appendChild(e)}e.textContent=css}
function setPal(p){const c=sp(p);s.pal=c;s.palH=[c,...(s.palH||[]).filter(x=>!sameP(x,c))].slice(0,3);save();render();vColores()}
const PRE=[['#DDCCB5','#512E26'],['#E1BAC8','#501F29'],['#8da2d9','#2e2e2e']].map(c=>sp({l:c[0],d:c[1]}));
let pc={t:0,p:1};
const sw=(c,a,n,cur)=>`<button class="g pw${cur?' cur':''}" data-a="${a}" data-n="${n}" aria-label="Usar combinación ${c.l} y ${c.d}"><i style="background:${c.l}"></i><i style="background:${c.d}"></i></button>`;
const ch=(t,k)=>`<h3 class="rs" data-a="ct" data-i="${k}" role="button" tabindex="0" aria-expanded="${!pc[k]}">${t} <b>${pc[k]?'+':'−'}</b></h3>`;
function vColores(){const p=s.pal?sp(s.pal):PD,h=s.palH||[],cu=c=>!!s.pal&&sameP(c,p);
$('#dlg').innerHTML=dh('Colores',1)+ch('Temas','t')+(pc.t?'':`<div class="pH">${PRE.map((c,i)=>sw(c,'pre',i,cu(c))).join('')}</div>`)+ch('Personalizado','p')+(pc.p?'':`<p class="sm">Elige dos colores</p><div class="pr"><div><input type="color" id="pl" value="${p.l}" aria-label="Primer color"></div><div><input type="color" id="pd" value="${p.d}" aria-label="Segundo color"></div></div><button class="full" data-a="palok">Aplicar</button><label>Últimas combinaciones</label>${h.length?`<div class="pH">${h.map((c,i)=>sw(c,'palh',i,cu(c))).join('')}</div>`:'<p class="sm">Todavía no aplicaste ninguna.</p>'}`)+`<button class="g full" data-a="palrst">Restaurar original</button>`}
function ajustes(){const d5=Object.keys(AJ);let ord=s.menuOrder||[];if(!d5.every(x=>ord.includes(x))||ord.some(x=>!AJ[x]))ord=d5.slice();$('#dlg').innerHTML=dh('Ajustes')+`<div id="aj">${ord.map(x=>`<button class="g full" data-a="${x}">${AJ[x]}</button>`).join('')}</div>`}
function opn(){const d=$('#dlg');if(!d.open)d.showModal()}
function stats(){const n=streak(),m=nextMs(n),w=weekMin(),g=s.goal||120,p=Math.min(100,Math.round(w/g*100)),subs=[...new Set((s.rec||[]).map(x=>x.sub||''))].sort(),L=statSub==null?s.log:logOf(statSub),tot=Object.values(L).reduce((a,b)=>a+b,0),all=Object.values(s.log||{}).reduce((a,b)=>a+b,0),by={};(s.rec||[]).forEach(x=>{const k=x.sub||'';by[k]=(by[k]||0)+x.m});const mx=Math.max(1,...Object.values(by)),nm=statSub==null?'':(statSub||'sin materia');
const hd=(k,ti)=>`<h3 class="rs" data-a="scol" data-i="${k}" role="button" aria-expanded="${!s.col[k]}">${ti} <b>${s.col[k]?'+':'−'}</b></h3>`;
$('#dlg').innerHTML=dh('Estadísticas',1)+hd('st_goal','🎯 Objetivo semanal')+(s.col.st_goal?'':`<div class="f2"><div><label for="goal">Minutos a cumplir por semana</label><input type="number" id="goal" min="1" value="${g}"></div><div><label>&nbsp;</label><button class="full" style="margin-top:0" data-a="goal">Guardar</button></div></div><button class="g full" data-a="up">＋ Subir meta un 10 %</button><div class="tr" style="margin-top:8px"><b>🎯 ${w}/${g} min</b><span class="sm">${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>`)
+hd('st_racha','🔥 Racha')+(s.col.st_racha?'':`<div class="big">${n} ${n===1?'día':'días'}</div><div class="sm">seguidos estudiando · meta: ${lbl(m)}</div><div class="bar"><i style="width:${Math.round(n/m*100)}%"></i></div><div class="sm" style="margin-top:12px">Ver gráfico por materia</div><div class="flt"><button class="fb ${statSub==null?'sel':''}" data-a="ssub" data-i="*">Total (todas)</button>${subs.map(x=>`<button class="fb ${statSub===x?'sel':''}" data-a="ssub" data-i="${esc(x)}">${x?esc(x):'Sin materia'}</button>`).join('')}</div><p><b>${tot} min</b> ${statSub==null?'en total (todas las materias)':'en '+esc(nm)} · hoy: ${L[dk(Date.now())]||0} min</p>${statSub==null?'':`<p class="sm">Total de todas las materias: <b>${all} min</b></p>`}${chart(L)}<div class="sm">Minutos por día (últimos 14 días)${nm?' · '+esc(nm):''}</div>`+(Object.keys(by).length?`<div class="sm" style="margin-top:12px">Minutos por materia (total ${all} min)</div>`+Object.keys(by).sort((a,b)=>by[b]-by[a]).map(x=>`<div class="tr"><span>${x?esc(x):'Sin materia'}</span><b>${by[x]} min</b></div><div class="bar"><i style="width:${Math.round(by[x]/mx*100)}%"></i></div>`).join(''):'<p class="sm">Todavía no registraste minutos.</p>'))}
function setFecha(){const e=$('#dt');if(!e)return;const d=new Date(),k=dk(d);if(e.dataset.k===k)return;e.dataset.k=k;e.innerHTML='<b>'+['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][d.getDay()]+'</b><span>'+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()%100).padStart(2,'0')+'</span>'}
function tick(){setFecha();const a=s.sess,c=$('#clk');if(!c)return;const i=$('#inf');
if(!a){const d=Math.max(1,+s.dur||15);c.textContent=String(d).padStart(2,'0')+':00';i.textContent='';return}
const el=(a.el||0)+(a.pa?0:Date.now()-a.st),r=a.dur*60000-el;if(r<=0){add(a.dur,a.sub);s.sess=null;msg='¡Sesión completa! Sumaste '+a.dur+' min 🎉';save();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}render();return}
const t=Math.ceil(r/1000);c.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');i.textContent=(a.sub?a.sub+' · ':'')+'Comenzó '+hm(a.t0||a.st)+(a.pa?' · en pausa':' · termina '+hm(Date.now()+r))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||jd)return;const a=t.dataset.a,k=t.dataset.i,n=+t.dataset.n;
if(a==='theme'){s.theme=s.theme==='dark'?'light':'dark'}
else if(a==='menu'){ed=null;menu();opn();return}
else if(a==='ajustes'){ajustes();opn();return}
else if(a==='msel'){msel[k]=!msel[k];menu();return}
else if(a==='msall'){const ks=s.order.filter(x=>info(x)&&!s.rm[x]),all=ks.every(x=>msel[x]);ks.forEach(x=>msel[x]=!all);menu();return}
else if(a==='bhide'||a==='bshow'){selKeys().forEach(x=>s.hidden[x]=a==='bhide');msel={};save();render();menu();return}
else if(a==='sdel'){if(!confirm('¿Eliminar "'+info(k)[1]+'"?'+(s.custom[k]?' Se borra con todo su contenido.':' Después podés restaurarla.')))return;delSec(k);save();render();menu();return}
else if(a==='bdel'){const ks=selKeys();if(!ks.length||!confirm('¿Eliminar '+ks.length+' sección(es)? Las propias se borran con su contenido.'))return;ks.forEach(delSec);msel={};save();render();menu();return}
else if(a==='srest'){s.rm={};save();render();menu();return}
else if(a==='scol'){s.col[k]=!s.col[k];save();stats();return}
else if(a==='ssub'){statSub=k==='*'?null:k;stats();return}
else if(a==='cedit'){ed=k;menu();return}
else if(a==='ccancel'){ed=null;nsOpen=false;menu();return}
else if(a==='nsec'){if(ed){ed=null;nsOpen=false}else nsOpen=!nsOpen;menu();return}
else if(a==='cdel'){const c=s.custom[k];if(!c||!confirm('¿Eliminar la sección "'+c.t+'" y todo su contenido?'))return;delete s.custom[k];delete s[k];delete s.hidden[k];delete s.col[k];delete s.hd[k];s.order=s.order.filter(x=>x!==k);ed=null;save();render();menu();return}
else if(a==='csave'){const ti=$('#nt').value.trim();if(!ti){setSt('Poné un título para la sección');return}const ic=$('#ni').value.trim()||'📌';if(ed&&s.custom[ed]){s.custom[ed].t=ti;s.custom[ed].i=ic}else{const id='c'+Date.now(),ty=$('#nk').value;s.custom[id]={t:ti,i:ic,k:ty};if(ty==='lista')s[id]=[];s.order.push(id)}ed=null;nsOpen=false;save();render();menu();return}
else if(a==='close'){$('#dlg').close();return}
else if(a==='stats'){stats();opn();return}
else if(a==='nube'){vNube();opn();return}
else if(a==='frase'){vFrase();opn();return}
else if(a==='colores'){vColores();opn();return}
else if(a==='ct'){pc[k]=pc[k]?0:1;applyPal(s.pal);vColores();return}
else if(a==='pre'){const c=PRE[n];if(c)setPal(c);return}
else if(a==='palok'){setPal({l:$('#pl').value,d:$('#pd').value});return}
else if(a==='tema'){const t=PT[n];if(t)setPal({l:t[1],d:t[2]});return}
else if(a==='palh'){const c=(s.palH||[])[n];if(c)setPal(c);return}
else if(a==='palrst'){s.pal=null;save();render();vColores();return}
else if(a==='phrase'){s.phrase=$('#ph').value.trim()||PH;save();render();setSt('Frase guardada ✓');return}
else if(a==='sz'){s.sz=s.sz||{};s.sz[k]=n}
else if(a==='edone'){em=false;esel={};render();return}
else if(a==='esel'){esel[k]=!esel[k];render();return}
else if(a==='eall'){const ks=visK(),all=ks.length&&ks.every(x=>esel[x]);ks.forEach(x=>esel[x]=!all);render();return}
else if(a==='eshow'){s.order.forEach(k=>{if(s.hidden[k])s.hidden[k]=false});save();render();return}
else if(a==='ehide'){visK().filter(x=>esel[x]).forEach(x=>s.hidden[x]=true);esel={};save();render();return}
else if(a==='edel'){const ks=visK().filter(x=>esel[x]);if(!ks.length||!confirm('¿Eliminar '+ks.length+' sección(es)? Las propias se borran con su contenido; las integradas se pueden restaurar desde Ajustes → Secciones.'))return;ks.forEach(delSec);esel={};save();render();return}
else if(a==='col'){if(em)return;s.col[k]=!s.col[k]}
else if(a==='eye'){s.hidden[k]=!s.hidden[k];save();render();menu();return}
else if(a==='mv'){const o=s.order,i=o.indexOf(k),j=i+n;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];save();render();menu();return}
else if(a==='sync'){cfg={url:$('#cu').value.trim(),code:$('#cc').value.trim()};localStorage.setItem('tablero-sync',JSON.stringify(cfg));setSt('Sincronizando...');pull().then(push);stream();return}
else if(a==='add'){const i=$('#in-'+k),v=i.value.trim();if(!v)return;s[k].push({t:v,d:false})}
else if(a==='tg'){s[k][n].d=!s[k][n].d}
else if(a==='rm'){s[k].splice(n,1)}
else if(a==='clr'){if(!confirm('¿Eliminar todas las tareas completadas?'))return;s[k]=s[k].filter(x=>!x.d)}
else if(a==='hd'){s.hd[k]=!s.hd[k]}
else if(a==='cl'){s.clases[n]=!s.clases[n]}
else if(a==='goal'){s.goal=Math.max(1,+$('#goal').value||120);save();render();stats();return}
else if(a==='up'){s.goal=Math.ceil((s.goal||120)*1.1);save();render();stats();return}
else if(a==='reg'){const v=Math.round(+$('#min').value);if(!(v>0))return;const d=($('#rd')&&$('#rd').value)||dk(Date.now());s.rec=s.rec||[];s.rec.push({id:rid(),d,m:v,sub:($('#rsub').value||'').trim()});rebuildLog()}
else if(a==='rsave'){const v=Math.round(+$('#min').value);if(!(v>0))return;const x=(s.rec||[]).find(y=>y.id===recEd);if(x){x.m=v;x.d=$('#rd').value||x.d;x.sub=($('#rsub').value||'').trim()}recEd=null;rebuildLog()}
else if(a==='rcancel'){recEd=null;render();return}
else if(a==='redit'){recEd=k;s.col.regsub=false;render();const i=$('#min');if(i){i.scrollIntoView({block:'center'});i.focus()}return}
else if(a==='cmv'){const[y,m]=cmo.split('-').map(Number),d=new Date(y,m-1+n,1);cmo=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();return}
else if(a==='choy'){sel=dk(Date.now());cmo=sel.slice(0,7);render();return}
else if(a==='cday'){sel=k;render();return}
else if(a==='evadd'){const ti=$('#et').value.trim(),d=$('#edt').value;if(!ti||!d)return;s.ev=s.ev||[];s.ev.push({id:'e'+Date.now(),t:ti,d});sel=d;cmo=d.slice(0,7)}
else if(a==='evf'){s.evh=s.evh||{};s.evh[k]=!s.evh[k]}
else if(a==='evclr'){if(!confirm('¿Eliminar TODOS los eventos del calendario?'))return;evEd=null;s.ev=[]}
else if(a==='evedit'){const e=(s.ev||[]).find(x=>x.id===k);if(!e)return;evEd=k;sel=e.d;cmo=e.d.slice(0,7);render();const i=$('#et');if(i){i.scrollIntoView({block:'center'});i.focus()}return}
else if(a==='evcancel'){evEd=null;render();return}
else if(a==='evsave'){const ti=$('#et').value.trim(),d=$('#edt').value;if(!ti||!d)return;const e=(s.ev||[]).find(x=>x.id===evEd);if(e){e.t=ti;e.d=d}else{s.ev=s.ev||[];s.ev.push({id:'e'+Date.now(),t:ti,d})}evEd=null;sel=d;cmo=d.slice(0,7)}
else if(a==='evdel'){const e=(s.ev||[]).find(x=>x.id===k);if(!e||!confirm('¿Eliminar "'+e.t+'"?'))return;if(evEd===k)evEd=null;s.ev=s.ev.filter(x=>x.id!==k)}
else if(a==='rdel'){if(!confirm('¿Eliminar este registro?'))return;s.rec=(s.rec||[]).filter(x=>x.id!==k);if(recEd===k)recEd=null;rebuildLog()}
else if(a==='start'){const d=Math.min(180,Math.max(1,Math.round(+$('#dur').value||15)));s.dur=d;s.sub=$('#sub').value.trim();const n0=Date.now();s.sess={st:n0,t0:n0,el:0,pa:false,dur:d,sub:s.sub};msg=''}
else if(a==='pause'){const x=s.sess;if(!x||x.pa)return;x.el=(x.el||0)+Date.now()-x.st;x.pa=true}
else if(a==='resume'){const x=s.sess;if(!x||!x.pa)return;x.st=Date.now();x.pa=false}
else if(a==='stop'){const x=s.sess,m=Math.min(x.dur,Math.round(((x.el||0)+(x.pa?0:Date.now()-x.st))/60000));if(m>0)add(m,x.sub);msg=m>0?'Sesión frenada. Sumaste '+m+' min.':'Sesión frenada antes de 1 minuto.';s.sess=null}
else if(a==='reset'){if(s.sess&&!confirm('¿Cancelar la sesión sin registrar tiempo?'))return;s.sess=null;msg=''}
save();render()});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(e.target.id==='ph'){s.phrase=e.target.value.trim()||PH;render();setSt('Frase guardada ✓')}if(f==='nota'&&s.custom[e.target.dataset.i])s.custom[e.target.dataset.i].txt=e.target.value;if(f==='sub')s.sub=e.target.value;if(f==='dur'){s.dur=Math.max(1,+e.target.value||15);tick()}save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&em){em=false;esel={};render()}if(e.key==='Enter'&&e.target.dataset.a==='stats'){e.target.click();return}if(e.key==='Enter'&&e.target.id==='ph'){e.target.blur();return}if(e.key==='Enter'&&e.target.dataset.e!==undefined){const w=e.target.dataset.e,b=w?document.querySelector('[data-a="'+w+'"]'):e.target.closest('.row,.body').querySelector('button');b&&b.click()}});
let ed=null,nt;
document.addEventListener('input',e=>{const x=e.target;if(x.dataset.f==='nota'&&s.custom[x.dataset.i]){s.custom[x.dataset.i].txt=x.value;clearTimeout(nt);nt=setTimeout(save,600)}});
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.hd');if(!h)return;e.preventDefault();dg=h.parentElement;dg.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!dg)return;const x=document.elementFromPoint(e.clientX,e.clientY),o=x&&x.closest('#rows .mr');if(o&&o!==dg){const l=[...o.parentElement.children];l.indexOf(dg)<l.indexOf(o)?o.after(dg):o.before(dg)}});
function endDrag(){if(!dg)return;dg.classList.remove('drag');s.order=[...$('#rows').children].map(c=>c.dataset.k);dg=null;save();render()}
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
const clearHold=()=>{clearTimeout(gt);document.querySelectorAll('.card.holding').forEach(c=>c.classList.remove('holding'))};
document.addEventListener('pointerdown',e=>{const h=e.target.closest('#main h2[data-i]');if(!h||e.target.closest('.sz,input')||(e.pointerType==='mouse'&&e.button))return;const k=h.dataset.i;gx=e.clientX;gy=e.clientY;clearHold();gd={k,on:false,pid:e.pointerId,lt:null,cd:0};if(em)return;h.parentElement.classList.add('holding');gt=setTimeout(()=>{if(!gd)return;em=true;gd.on=true;try{document.body.setPointerCapture(gd.pid)}catch(x){}try{navigator.vibrate(30)}catch(x){}render()},1700)});
document.addEventListener('pointermove',e=>{if(!gd)return;if(!gd.on){if(Math.hypot(e.clientX-gx,e.clientY-gy)>9){if(em){gd.on=true;try{document.body.setPointerCapture(gd.pid)}catch(x){}render()}else{clearHold();gd=null}}return}
if(e.clientY<70)scrollBy(0,-14);else if(e.clientY>innerHeight-70)scrollBy(0,14);
if(Date.now()<gd.cd)return;const x=document.elementFromPoint(e.clientX,e.clientY),c=x&&x.closest('#main .card[data-k]');if(!c)return;const tg=c.dataset.k;if(tg===gd.k){gd.lt=null;return}if(tg===gd.lt)return;
const o=s.order,i=o.indexOf(gd.k),j=o.indexOf(tg);o.splice(i,1);o.splice(j,0,gd.k);gd.lt=tg;gd.cd=Date.now()+250;render()});

document.addEventListener('pointerup',endGd);document.addEventListener('pointercancel',endGd);
let ag=null,at=0,ax,ay;

document.addEventListener('pointermove',e=>{if(!ag){if(at&&Math.hypot(e.clientX-ax,e.clientY-ay)>10){clearTimeout(at);at=0}return}const x=document.elementFromPoint(e.clientX,e.clientY),o=x&&x.closest('#aj button');if(o&&o!==ag){const l=[...o.parentElement.children];l.indexOf(ag)<l.indexOf(o)?o.after(ag):o.before(ag)}});
function endAg(){clearTimeout(at);at=0;if(!ag)return;ag.classList.remove('drag');s.menuOrder=[...$('#aj').children].map(c=>c.dataset.a);ag=null;jd=true;setTimeout(()=>jd=false,80);save()}
document.addEventListener('pointerup',endAg);document.addEventListener('pointercancel',endAg);
document.addEventListener('touchmove',e=>{if(ag||(gd&&gd.on))e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#aj,#main h2[data-i]'))e.preventDefault()});
document.addEventListener('input',e=>{if(e.target.id==='pl'||e.target.id==='pd')applyPal({l:$('#pl').value,d:$('#pd').value})});
$('#dlg').addEventListener('close',()=>applyPal(s.pal));
$('#dlg').addEventListener('click',e=>{const d=e.currentTarget,b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();tick()}});
setInterval(tick,1000);setInterval(pull,20000);
render();pull();stream();
